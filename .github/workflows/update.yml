name: Update terminal stats
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update public GitHub stats
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE: ${{ github.repository_owner }}
        run: |
          gh api --paginate "users/$PROFILE/repos?type=owner&per_page=100" | jq -s 'add // [] | {repos: length, stars: (map(.stargazers_count) | add // 0)}' > /tmp/terminal-stats.json
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          stats = json.loads(Path('/tmp/terminal-stats.json').read_text())
          p = Path('phytone-terminal.svg')
          svg = p.read_text()
          for id_, key in [('repo-count', 'repos'), ('star-count', 'stars')]:
              svg, n = re.subn(r'(<tspan id="' + id_ + r'">)[^<]*(</tspan>)', lambda m: m[1] + ' ' + str(stats[key]) + m[2], svg)
              if n != 1:
                  raise ValueError(f'Missing or duplicate {id_}')
          p.write_text(svg)
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add phytone-terminal.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Update terminal stats'
            git push
          fi
